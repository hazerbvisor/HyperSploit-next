name: Release validation
on:
  pull_request:
  push:
    branches: [main, phase-5/release-polish]
jobs:
  release:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: ubuntu-24.04-arm, rid: linux-arm64 }
          - { os: macos-latest, rid: osx-arm64 }
          - { os: macos-15-intel, rid: osx-x64 }
          - { os: windows-latest, rid: win-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      - run: dotnet test -c Release --no-build --no-restore
      - run: dotnet publish HyperSploit.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishAot=false -o artifacts/release/${{ matrix.rid }}
      - name: Smoke test
        shell: bash
        run: |
          app=./artifacts/release/${{ matrix.rid }}/HyperSploit.Next
          if [ '${{ matrix.rid }}' = win-x64 ]; then app="$app.exe"; fi
          "$app" --help
          "$app" --version
          "$app" --diagnostics
          cp LICENCE NOTICE artifacts/release/${{ matrix.rid }}/
      - uses: actions/upload-artifact@v4
        with:
          name: HyperSploit-Next-${{ matrix.rid }}
          path: artifacts/release/${{ matrix.rid }}/
